<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteo Barbacoaj</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container">
        <h1>Escribí un nombre en un papelito y metelo en la bolsa para participar</h1>

        <div id="papelito" class="estilo-papelito" draggable="true" contenteditable="false"></div>
        <button id="nuevo-papelito" class="btn-nuevo-papelito">Otro papelito!</button>

        <div id="bolsa" class="bolsa"></div>
    </div>
    <script type="module" src="app.js"></script>
</body>
</html>
